<body style="background-color: #1e1b1a">
  <div id="root"></div>
  <!-- Capture beforeinstallprompt before React mounts — useEffect runs too late -->
  <script>
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__installPrompt = e;
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Set dynamic apple-touch-icon based on subdomain (for iOS PWA)
    (function () {
      const hostname = window.location.hostname;
      const subdomain = hostname.split(".")[0];
      const serverOrigin = "https://server.samparka.co";

      // Only set custom icon if on a subdomain (not main samparka.co)
      if (
        subdomain &&
        subdomain !== "samparka" &&
        subdomain !== "www" &&
        subdomain !== "localhost"
      ) {
        // Create apple-touch-icon link
        const appleIcon = document.createElement("link");
        appleIcon.rel = "apple-touch-icon";
        appleIcon.href = `${serverOrigin}/apple-touch-icon/${subdomain}.png`;
        document.head.appendChild(appleIcon);

        // Also create multiple sizes for better iOS compatibility
        const appleIcon120 = document.createElement("link");
        appleIcon120.rel = "apple-touch-icon";
        appleIcon120.sizes = "120x120";
        appleIcon120.href = `${serverOrigin}/apple-touch-icon/${subdomain}.png`;
        document.head.appendChild(appleIcon120);

        const appleIcon152 = document.createElement("link");
        appleIcon152.rel = "apple-touch-icon";
        appleIcon152.sizes = "152x152";
        appleIcon152.href = `${serverOrigin}/apple-touch-icon/${subdomain}.png`;
        document.head.appendChild(appleIcon152);

        const appleIcon180 = document.createElement("link");
        appleIcon180.rel = "apple-touch-icon";
        appleIcon180.sizes = "180x180";
        appleIcon180.href = `${serverOrigin}/apple-touch-icon/${subdomain}.png`;
        document.head.appendChild(appleIcon180);

        // Manifest link — required for Chrome's beforeinstallprompt to fire
        const manifestLink = document.createElement("link");
        manifestLink.rel = "manifest";
        manifestLink.href = `${serverOrigin}/manifest.json?subdomain=${subdomain}`;
        document.head.appendChild(manifestLink);
      } else if (hostname === "localhost" || hostname === "127.0.0.1") {
        // Dev: use ?store= query param to load manifest for testing
        const storeParam = new URLSearchParams(window.location.search).get("store");
        if (storeParam) {
          const manifestLink = document.createElement("link");
          manifestLink.rel = "manifest";
          manifestLink.href = `${serverOrigin}/manifest.json?subdomain=${storeParam}`;
          document.head.appendChild(manifestLink);
        }
      }
    })();

    // Only register the Service Worker in production (not on localhost).
    // On localhost, the SW conflicts with Vite's HMR and causes unexpected reloads.
    const isLocalhost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
    if ("serviceWorker" in navigator && !isLocalhost) {
      navigator.serviceWorker
        .register("/service-worker.js")
        .then((registration) => {
          console.log("Service Worker registered successfully.");

          // Check for updates immediately
          registration.update().then(() => {
            console.log('SW update check complete');
          });

          // Listen for new service worker installing
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('New service worker found, installing...');

            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('New service worker installed, will activate when tabs closed');
                // Optionally show UI to user: "Update available - please close all tabs to refresh"
              }
            });
          });
        })
        .catch((err) =>
          console.log("Service Worker registration failed:", err)
        );
    }
  </script>
